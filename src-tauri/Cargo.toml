[package]
name = "hope"
version = "0.1.0"
description = "Hope — time tracking"
edition = "2021"
publish = false

[lib]
name = "hope_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40", features = ["bundled"] }
specta = { version = "=2.0.0-rc.25" }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# Native materials for the main window (rebuild-plan 4.4). Already in the tree via Tauri; no new crates.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSAppearance",
  "NSResponder",
  "NSView",
  "NSVisualEffectView",
  "NSWindow",
] }
